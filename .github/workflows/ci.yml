name: CI

# Verifies every push and pull request: build, typecheck, test, and a syntax
# check over the emitted entry points. The publish workflow repeats the tests
# before uploading, so this one is the fast feedback loop, not the release gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    # Self-hosted runner label. It must exist on this repository, or the job
    # waits for a runner forever: `gh api repos/d0nj/dsh-plugins/actions/runners`.
    runs-on: instabox-medium
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.2

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The local cache is keyed by task input hash, so restoring it across runs
      # turns an unchanged package into a replay. `.turbo/cache` is the artifact
      # store only; `.turbo` also holds auth cookies and daemon state.
      - name: Restore the Turborepo cache
        uses: actions/cache@v6
        # Caching is an optimization: a cache-service outage, or a runner too old
        # for this action's runtime, must not fail verification.
        continue-on-error: true
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Turbo caches by input hash across the workspace, so a change to one
      # package re-runs only that package and its dependents. `TURBO_TOKEN` and
      # `TURBO_TEAM` switch on Remote Cache when both repository secrets exist;
      # with neither set turbo reports "Remote caching disabled" and uses the
      # restored local cache, so CI is faster either way.
      - name: Build, typecheck, test, check
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm exec turbo run build typecheck test check

      - name: Verify publishable contents
        # Catches a `files` entry that omits something a consumer needs, such as
        # the bundle patch or the built entry point: the tarball would install and
        # then fail to load.
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            if grep -q '"private": *true' "$dir/package.json"; then
              continue
            fi
            echo "::group::pack $dir"
            (cd "$dir" && pnpm pack --dry-run 2>&1 | tail -n 30)
            echo "::endgroup::"
          done