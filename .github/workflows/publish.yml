name: Publish

# semantic-release derives the version from Conventional Commits on main, then
# tags, releases on GitHub, and publishes to npm. Each package runs from its own
# directory, so commits are attributed by the files they touched and every
# package versions independently from its own <package>@<version> tags.
#
# npm authentication prefers OIDC trusted publishing. Set an NPM_TOKEN secret
# only to allow the first publish of a package that does not exist on npm yet,
# which trusted publishing cannot create.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.2

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or later; the Node 22.14 image ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm exec turbo run build typecheck test check

      - name: Release
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
